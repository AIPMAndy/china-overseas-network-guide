name: Content quality
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check syntax
        run: python -m compileall -q tools
      - name: Validate repository links and obvious secrets
        run: python tools/validate_repo.py
      - name: Build offline site
        run: python tools/build_site.py
      - name: Check generated index is committed
        run: git diff --exit-code -- index.html
