name: 教程步骤/链接错误
about: 只提交脱敏的问题复现信息
body:
  - type: markdown
    attributes:
      value: "🔒 禁止贴真实 IP、密钥、订阅链接、截图中的敏感信息。"
  - type: input
    id: chapter
    attributes:
      label: 章节或链接
      placeholder: docs/07-故障排查树.md
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 问题描述与脱敏复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果及官方参考
